spring.application.name=health-tg-bot
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/health_tg}
spring.data.mongodb.auto-index-creation=true
health-tg.auth.default-timezone=${DEFAULT_TIMEZONE:Europe/Warsaw}
health-tg.files.root=${FILE_STORAGE_ROOT:${user.home}/.health-tg/files}
# SDK diagnostics can contain request URLs with the token. Application messages are sanitized.
logging.level.org.telegram=OFF
logging.level.okhttp3=OFF
