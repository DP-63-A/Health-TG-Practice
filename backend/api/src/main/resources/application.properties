spring.application.name=health-tg-backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/health_tg}
spring.data.mongodb.auto-index-creation=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true

health-tg.auth.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
health-tg.auth.allowed-telegram-ids=${TELEGRAM_ALLOWED_USER_IDS:}
health-tg.auth.init-data-ttl=15m
health-tg.auth.session-ttl=60m
health-tg.auth.default-timezone=Europe/Warsaw
health-tg.web.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# BE3-05 local demo seed/reset. Disabled unless the environment declares itself a demo environment.
health-tg.seed.demo-environment=${HEALTH_TG_DEMO_ENVIRONMENT:false}
health-tg.seed.allowed-database=${HEALTH_TG_DEMO_DATABASE:}
health-tg.seed.random-seed=${SEED_RANDOM_SEED:20260916}
health-tg.seed.start-date=${SEED_START_DATE:2026-09-14}
health-tg.seed.accounts.regular-telegram-id=${SEED_REGULAR_TELEGRAM_ID:}
health-tg.seed.accounts.irregular-telegram-id=${SEED_IRREGULAR_TELEGRAM_ID:}
health-tg.seed.accounts.incomplete-telegram-id=${SEED_INCOMPLETE_TELEGRAM_ID:}
