openapi: 3.1.0
info:
  title: Health-TG Practice API
  version: 0.1.0-be3-01
  summary: Canonical API contract with BE3-01 analytics response.
servers:
  - url: /api/v1
paths:
  /analytics:
    get:
      tags: [analytics]
      operationId: getAnalytics
      summary: Cards and daily series for a local calendar period
      description: |
        Only current confirmed entries contribute. Draft, cancelled and deleted entries are excluded.
        `from` and `to` are inclusive local dates in the requested IANA timezone.
        The response is a snapshot; `observations.generated_at` is its freshness timestamp.
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [today, days_7, days_21]
        - name: timezone
          in: query
          required: true
          schema:
            type: string
            example: Europe/Warsaw
        - name: checkin_category
          in: query
          required: false
          description: Category selected for the state series; defaults to mood.
          schema:
            type: string
            enum: [sleep_quality, digestion_comfort, wellbeing, mood]
      responses:
        '200':
          description: Analytics response; null values represent gaps or absence, not zero.
          content:
            application/json:
              schema:
                $ref: ./schemas/analytics.json
              examples:
                normal:
                  externalValue: ./fixtures/analytics_normal.json
                empty:
                  externalValue: ./fixtures/analytics_empty.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid period, timezone or category.
components:
  responses:
    Unauthorized:
      description: Missing, invalid or expired session.
      content:
        application/json:
          schema:
            type: object
            required: [code, message, request_id]
            properties:
              code: {type: string}
              message: {type: string}
              request_id: {type: string}
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
